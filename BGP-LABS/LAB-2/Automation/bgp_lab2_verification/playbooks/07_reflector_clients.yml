---
- name: Verification 07 - Route reflector clients
  hosts: routers
  gather_facts: false
  vars:
    result_dir: "{{ playbook_dir }}/../results/07_reflector_clients"
    verification_commands:
      R1:
        - "show ip bgp neighbors 2.2.2.2 | include Route-Reflector"
        - "show ip bgp neighbors 4.4.4.4 | include Route-Reflector"
      R2:
        - "show ip bgp summary"
      R3:
        - "show ip bgp neighbors 2.2.2.2 | include Route-Reflector"
        - "show ip bgp neighbors 4.4.4.4 | include Route-Reflector"
      R4:
        - "show ip bgp summary"
  tasks:
    - name: Ensure local result directory exists
      ansible.builtin.file:
        path: "{{ result_dir }}"
        state: directory
      delegate_to: localhost
      become: false
      run_once: true

    - name: Run verification commands
      cisco.ios.ios_command:
        commands: "{{ verification_commands[inventory_hostname] }}"
      register: verification_output

    - name: Save command output for this router
      ansible.builtin.copy:
        dest: "{{ result_dir }}/{{ inventory_hostname }}.txt"
        content: |
          Verification: Verification 07 - Route reflector clients
          Router: {{ inventory_hostname }}
          Timestamp (controller): {{ lookup('pipe', 'date -Is') }}
          ========================================
          {% for result in verification_output.stdout %}
          COMMAND {{ loop.index }}: {{ verification_commands[inventory_hostname][loop.index0] }}
          ----------------------------------------
          {{ result }}
          
          {% endfor %}
      delegate_to: localhost
      become: false
